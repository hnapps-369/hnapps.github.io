  <h1>LexiMe サポート</h1>
  <p>LexiMeをご利用いただきありがとうございます。</p>

  <h2>よくある質問</h2>

  <h3>Q. 音声入力が反応しない</h3>
  <p>設定 → プライバシーとセキュリティ → マイク → LexiMeをオンにしてください。</p>

  <h3>Q. 翻訳が表示されない</h3>
  <p>インターネット接続を確認してください。翻訳にはネット接続が必要です。</p>

  <h3>Q. 単語帳のデータが消えた</h3>
  <p>データは端末内に保存されています。アプリを削除するとデータが消えますのでご注意ください。</p>

  <h2>お問い合わせ</h2>
  <p>上記で解決しない場合は、以下のメールアドレスまでご連絡ください。</p>
  <p>📧 <a href="mailto:support@hnapps.studio">support@hnapps.studio</a></p>
